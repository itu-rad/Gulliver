name: "Self-RAG Monolith 4B \u2014 single call (multi-hop / HotpotQA, MLX)"
pipelines:
- name: Self-RAG Monolith 4B (multi-hop)
  inputs:
  - 0
  outputs:
  - 5
  dataset_stage_id: 0
  loadgen:
    component: loadgen.OfflineLoadScheduler
    queue_depth: 1
    max_queries: 60
    timeout: 3600000
    config:
      rate: 0
  stages:
  - name: Question dataloader
    id: 0
    outputs:
    - 1
    component: stages.self_rag.SelfRAGDataLoader
    config:
      batch_size: 1
      dataset:
        name: hotpotqa/hotpot_qa
        subset: distractor
        split: validation
        question_column: question
        answers_column: answer
        offset: 0
        stride: 120
  - name: Document retriever
    id: 1
    outputs:
    - 2
    component: stages.self_rag.ChromaRetriever
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
    config:
      corpus_dataset:
        name: hotpotqa/hotpot_qa
        subset: distractor
        split: validation
        context_column: context
        context_row_offset: 0
        context_row_stride: 24
        max_context_rows: 310
        max_docs: 20000
      top_k: 5
      embedding_model: intfloat/e5-base-v2
      query_prefix: 'query: '
      passage_prefix: 'passage: '
      collection_name: self_rag_multihop_monolith_corpus
  - name: Monolith formatter
    id: 2
    outputs:
    - 3
    component: stages.self_rag.MonolithFormatter
    config:
      tokenizer_stage_id: 3
  - name: Monolith LLM
    id: 3
    outputs:
    - 4
    component: stages.llm_mlx.Inference
    config:
      model:
        name: mlx-community/Qwen3.5-4B-bf16
        gen_kwargs:
          max_tokens: 256
        thinking_budget: 3072
  - name: Monolith router
    id: 4
    outputs:
    - 5
    - 6
    component: stages.self_rag.MonolithRouter
    config:
      accept_stage_id: 5
      retry_stage_id: 6
      end_stage_id: 5
      max_retries: 2
  - name: End stage
    id: 5
    component: stages.TerminalCapture
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
  - name: Query rewrite formatter
    id: 6
    outputs:
    - 7
    component: stages.self_rag.QuestionRewriterFormatter
    config:
      tokenizer_stage_id: 3
      doc_chars: 1500
  - name: Query rewrite LLM
    id: 7
    outputs:
    - 1
    component: stages.llm_mlx.Inference
    config:
      model:
        name: mlx-community/Qwen3.5-4B-bf16
        gen_kwargs:
          max_tokens: 128
        thinking_budget: 3072
      depends_on_id: 3
  serialize_queries: true
listeners:
- macmon
