name: Collocation 4b bg_encodes_ts
listeners:
- dcgmi
- top
- vllm
pipelines:
- name: Self-RAG Decomposed-Shared 4b
  inputs:
  - 0
  outputs:
  - 12
  dataset_stage_id: 0
  loadgen:
    component: loadgen.PoissonLoadScheduler
    queue_depth: 4
    max_queries: 4
    timeout: 3600000
    config:
      rate: 0.031008
      seed: 0
  stages:
  - name: Question dataloader
    id: 0
    outputs:
    - 1
    component: stages.self_rag.SelfRAGDataLoader
    config:
      batch_size: 1
      dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: question-answer
        split: test
        question_column: question
        answers_column: answer
        offset: 0
        stride: 15
  - name: Document retriever
    id: 1
    outputs:
    - 2
    component: stages.self_rag.ChromaRetriever
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
    config:
      corpus_dataset:
        name: rag-datasets/rag-mini-wikipedia
        subset: text-corpus
        split: passages
        text_column: passage
        max_docs: 3200
      top_k: 5
      embedding_model: intfloat/e5-base-v2
      query_prefix: 'query: '
      passage_prefix: 'passage: '
      collection_name: self_rag_factoid_decomposed_corpus
  - name: Retrieval grader formatter
    id: 2
    outputs:
    - 3
    component: stages.self_rag.RetrievalGraderFormatter
    config:
      tokenizer_stage_id: 3
  - name: Shared LLM (grade)
    id: 3
    outputs:
    - 4
    component: stages.llm_server.Inference
    config:
      concurrency: 8
      model:
        gen_kwargs:
          max_new_tokens: 64
          do_sample: false
        thinking_budget: 1024
      server:
        engine: vllm
        model: Qwen/Qwen3.5-4B
        port: 0
        dtype: bfloat16
        max_model_len: 8192
        launch_args:
        - --max-num-seqs
        - '8'
        - --shutdown-timeout
        - '60'
        gpu_memory_utilization: 0.5
      tokenizer_name: Qwen/Qwen3.5-4B
  - name: Grade router
    id: 4
    outputs:
    - 5
    - 10
    - 12
    component: stages.self_rag.RelevanceFilterRouter
    config:
      max_retries: 2
      yes_stage_id: 5
      no_stage_id: 10
      end_stage_id: 12
      on_exhaust: true
  - name: Answer generator formatter
    id: 5
    outputs:
    - 6
    component: stages.self_rag.AnswerGeneratorFormatter
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
    config:
      tokenizer_stage_id: 3
  - name: Shared LLM (generate)
    id: 6
    outputs:
    - 7
    component: stages.llm_server.Inference
    config:
      concurrency: 8
      model:
        gen_kwargs:
          max_new_tokens: 256
          do_sample: false
        thinking_budget: 1024
      depends_on_id: 3
  - name: Hallucination grader formatter
    id: 7
    outputs:
    - 8
    component: stages.self_rag.HallucinationGraderFormatter
    config:
      tokenizer_stage_id: 3
  - name: Shared LLM (hallucination)
    id: 8
    outputs:
    - 9
    component: stages.llm_server.Inference
    config:
      concurrency: 8
      model:
        gen_kwargs:
          max_new_tokens: 16
          do_sample: false
        thinking_budget: 1024
      depends_on_id: 3
  - name: Hallucination router
    id: 9
    outputs:
    - 10
    - 12
    - 12
    component: stages.self_rag.BinaryRouter
    config:
      max_retries: 2
      retry_is_yes: true
      yes_stage_id: 10
      no_stage_id: 12
      end_stage_id: 12
      on_exhaust: end
  - name: Query rewrite formatter
    id: 10
    outputs:
    - 11
    component: stages.self_rag.QuestionRewriterFormatter
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
    config:
      tokenizer_stage_id: 3
      doc_chars: 1500
  - name: Shared LLM (rewrite)
    id: 11
    outputs:
    - 1
    component: stages.llm_server.Inference
    config:
      concurrency: 8
      model:
        gen_kwargs:
          max_new_tokens: 128
          do_sample: false
        thinking_budget: 1024
      depends_on_id: 3
  - name: End stage
    id: 12
    component: stages.TerminalCapture
    polling_policy: utils.queues.polling.FirstSubmittedPolicy
  serialize_queries: false
- name: BG encoder encode_1s
  inputs:
  - 0
  outputs:
  - 2
  dataset_stage_id: 0
  loadgen:
    component: loadgen.OfflineLoadScheduler
    queue_depth: 1
    max_queries: 1000000
    timeout: 10800
    config:
      rate: 0
  stages:
  - name: VQA dataloader
    id: 0
    outputs:
    - 1
    component: stages.multimodal_vqa.VQADataLoader
    config:
      dataset:
        name: Multimodal-Fatima/OK-VQA_train
        split: train
        image_column: image
        question_column: question
        answers_column: answers
        max_samples: 100
      batch_size: 1
  - name: CLIP preprocess
    id: 1
    outputs:
    - 2
    component: stages.multimodal_vqa.CLIPImagePreprocess
    config:
      model:
        name: openai/clip-vit-large-patch14
  - name: CLIP vision encoder
    id: 2
    component: stages.multimodal_vqa.CLIPVisionEncoder
    config:
      model:
        name: openai/clip-vit-large-patch14
      device: cuda
  stop_with: Self-RAG Decomposed-Shared 4b
collocation: ''
